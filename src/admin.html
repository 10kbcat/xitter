<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Xitter</title>
<link rel="icon" type="image/png" href="/public/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0">
<style>
	:root { --bg: #000; --panel: #16181c; --line: #2f3336; --text: #e7e9ea; --dim: #71767b; --blue: #1d9bf0; --red: #f4212e; --green: #00ba7c; --gold: #e2b719; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
	a { color: var(--blue); text-decoration: none; }
	.icon { font-family: "Material Symbols Outlined"; font-size: 20px; line-height: 1; vertical-align: middle; }
	.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
	nav { border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; }
	nav .logo { width: 128px; margin: 4px 8px 20px; display: block; }
	nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 999px; background: none; color: var(--text); font: inherit; font-size: 16px; text-align: left; cursor: pointer; }
	nav button:hover { background: var(--panel); }
	nav button.on { font-weight: 700; }
	nav .who { margin-top: 24px; padding: 0 12px; color: var(--dim); font-size: 13px; }
	main { padding: 20px 24px 64px; max-width: 1100px; min-width: 0; }
	h1 { margin: 0 0 16px; font-size: 22px; }
	h2 { margin: 24px 0 10px; font-size: 17px; }
	.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
	input, select, textarea { padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; font: inherit; }
	input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); border-color: transparent; }
	textarea { width: 100%; min-height: 70px; resize: vertical; }
	.btn { padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
	.btn:hover { background: var(--panel); }
	.btn.primary { background: var(--text); color: #0f1419; border-color: var(--text); }
	.btn.danger { color: var(--red); border-color: rgba(244,33,46,.5); }
	.btn:disabled { opacity: .5; cursor: default; }
	.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
	.card { background: var(--panel); border-radius: 12px; padding: 14px 16px; }
	.card b { display: block; font-size: 24px; margin-top: 4px; }
	.card span { color: var(--dim); font-size: 13px; }
	.table { width: 100%; border-collapse: collapse; }
	.table th { text-align: left; color: var(--dim); font-weight: 400; font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
	.table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
	.table tr.click { cursor: pointer; }
	.table tr.click:hover td { background: var(--panel); }
	.scroll { overflow-x: auto; }
	.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
	.person img.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--panel); flex: none; }
	.person .names { min-width: 0; }
	.person .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.dim { color: var(--dim); }
	.small { font-size: 13px; }
	.flag { width: 16px; height: 16px; border-radius: 3px; vertical-align: -2px; }
	.badge { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -1px; }
	.badge.blue { background: var(--blue); } .badge.business { background: var(--gold); border-radius: 3px; } .badge.government { background: #829aab; border-radius: 3px; }
	.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
	.pill.suspended { color: var(--red); border-color: rgba(244,33,46,.5); }
	.pill.restricted, .pill.limited { color: var(--gold); border-color: rgba(226,183,25,.5); }
	.pill.staff { color: var(--blue); border-color: rgba(29,155,240,.5); }
	.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
	.box { background: var(--panel); border-radius: 12px; padding: 16px; }
	.box h2 { margin-top: 0; }
	.field { display: grid; gap: 4px; margin-bottom: 10px; }
	.field label { color: var(--dim); font-size: 13px; }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	.flags { display: flex; flex-wrap: wrap; gap: 6px; }
	.flags button { width: 34px; height: 34px; padding: 0; border: 2px solid var(--line); border-radius: 6px; background: none; color: var(--dim); font-size: 11px; cursor: pointer; display: grid; place-items: center; }
	.flags button img { width: 20px; height: 20px; border-radius: 3px; }
	.flags button.on { border-color: var(--blue); }
	.chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 8px; }
	.chart div { flex: 1; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
	.code { font-family: ui-monospace, Consolas, monospace; }
	.notice { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--blue); color: #fff; padding: 10px 18px; border-radius: 6px; z-index: 9; max-width: calc(100vw - 32px); }
	.notice.err { background: var(--red); }
	.secret { background: var(--bg); border: 1px dashed var(--line); padding: 10px; border-radius: 6px; margin-top: 8px; word-break: break-all; }
	.empty { color: var(--dim); padding: 24px 0; }
	@media (max-width: 760px) {
		.app { grid-template-columns: 1fr; }
		nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 2px; }
		nav .logo { display: none; }
		nav button { width: auto; padding: 8px 10px; font-size: 14px; }
		nav .who { display: none; }
		main { padding: 16px; }
	}
</style>
</head>
<body>
<div class="app">
	<nav id="nav">
		<img class="logo" src="/public/logo-dark.png" alt="Xitter">
	</nav>
	<main id="main"></main>
</div>
<script>
"use strict";
const csrf = (document.cookie.match(/(?:^|; )ct0=([^;]+)/) || [])[1] || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (sel, root = document) => root.querySelector(sel);
const RANK = { support: 1, moderator: 2, admin: 3 };
let me = null;
let flags = [];
const can = (role) => me && RANK[me.role] >= RANK[role];

async function api(action, body = {}) {
	const r = await fetch("/admin/api/" + action, { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": csrf }, body: JSON.stringify(body) });
	const data = await r.json().catch(() => ({}));
	if (!r.ok) throw new Error(data.error || "Request failed (" + r.status + ")");
	return data;
}

let noticeTimer;
function notice(text, err = false) {
	let n = $(".notice");
	if (!n) { n = document.createElement("div"); document.body.appendChild(n); }
	n.className = "notice" + (err ? " err" : "");
	n.textContent = text;
	clearTimeout(noticeTimer);
	noticeTimer = setTimeout(() => n.remove(), 3500);
}

// runs an action from a button, with its errors shown
async function act(fn, done) {
	try { const r = await fn(); if (done) notice(done); return r; } catch (e) { notice(e.message, true); }
}

const when = (d) => d ? new Date(d).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "never";
const avatar = (u) => u.avatar_url ? (u.avatar_url.startsWith("/") ? u.avatar_url : u.avatar_url) : "/abs/sticky/default_profile_images/default_profile_normal.png";
const badge = (u) => u.verified_type ? '<span class="badge ' + esc(u.verified_type) + '" title="' + esc(u.verified_type) + '"></span>' : "";
const flagImg = (u) => u.flag ? '<img class="flag" alt="' + esc(u.flag) + '" src="/public/flag-' + esc(u.flag) + '.svg">' : "";
const standing = (u) => (u.status && u.status !== "active" ? ' <span class="pill ' + esc(u.status) + '">' + esc(u.status) + "</span>" : "") + (u.role ? ' <span class="pill staff">' + esc(u.role) + "</span>" : "");
const person = (u) => '<div class="person"><img class="avatar" alt="" src="' + esc(avatar(u)) + '"><div class="names"><div><b>' + esc(u.name) + "</b> " + badge(u) + " " + flagImg(u) + '</div><div class="dim small">@' + esc(u.screen_name) + standing(u) + "</div></div></div>";

const PAGES = {
	overview: { icon: "monitoring", title: "Overview" },
	users: { icon: "group", title: "Users" },
	orgs: { icon: "domain", title: "Organisations" },
	posts: { icon: "article", title: "Posts" },
	invites: { icon: "confirmation_number", title: "Invites" },
	settings: { icon: "tune", title: "Settings" },
	audit: { icon: "history", title: "Audit log" },
};

function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);

async function route() {
	const [page, arg] = location.hash.slice(1).split("/");
	const name = PAGES[page] ? page : page === "user" ? "users" : "overview";
	document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.page === name));
	const main = $("#main");
	main.innerHTML = '<div class="empty">Loading…</div>';
	try {
		if (page === "user" && arg) await renderUser(main, arg);
		else await RENDER[name](main);
	} catch (e) {
		main.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
	}
}

const RENDER = {
	async overview(main) {
		const s = await api("stats");
		const mb = (Number(s.media_bytes) / 1048576).toFixed(1);
		const max = Math.max(1, ...s.days.map((d) => d.posts));
		main.innerHTML = "<h1>Overview</h1>" +
			'<div class="cards">' +
			[["Accounts", s.users], ["Active this week", s.active_week], ["Sanctioned", s.sanctioned], ["Posts", s.posts], ["Posts today", s.posts_today], ["Likes", s.likes], ["Media files", s.media], ["Media stored", mb + " MB"], ["Videos converting", s.videos_processing], ["Open invites", s.open_invites]]
				.map(([k, v]) => '<div class="card"><span>' + esc(k) + "</span><b>" + esc(v) + "</b></div>").join("") +
			"</div>" +
			'<h2>Posts per day, last two weeks</h2><div class="box"><div class="chart">' +
			s.days.map((d) => '<div title="' + esc(d.day) + ": " + d.posts + " posts, " + d.signups + ' sign-ups" style="height:' + (d.posts / max) * 100 + '%"></div>').join("") +
			'</div><div class="row dim small" style="justify-content:space-between;margin-top:6px"><span>' + esc(s.days[0]?.day) + "</span><span>" + esc(s.days[s.days.length - 1]?.day) + "</span></div></div>";
	},

	async users(main) {
		main.innerHTML = '<h1>Users</h1><div class="bar"><input id="q" placeholder="Search handle or name" style="flex:1;min-width:180px">' +
			'<select id="status"><option value="">Any standing</option><option>active</option><option>restricted</option><option>limited</option><option>suspended</option></select>' +
			'<label class="row small"><input type="checkbox" id="staff"> Staff only</label></div><div id="list" class="scroll"></div>';
		const load = async () => {
			const { users } = await api("users", { q: $("#q").value, status: $("#status").value, staff: $("#staff").checked });
			$("#list").innerHTML = users.length ? userTable(users) : '<div class="empty">No accounts match.</div>';
		};
		let t;
		$("#q").oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
		$("#status").onchange = load;
		$("#staff").onchange = load;
		await load();
	},

	async orgs(main) {
		const { orgs } = await api("orgs");
		main.innerHTML = "<h1>Organisations</h1>" +
			'<p class="dim">Organisations are accounts with the gold badge. Their affiliates show the organisation\'s picture as a badge after their name and are listed on its Affiliates tab.</p>' +
			(can("admin") ? '<div class="box" style="margin-bottom:16px"><h2>New organisation</h2><div class="row"><input id="oh" placeholder="handle"><input id="on" placeholder="Name"><button class="btn primary" id="oc">Create</button></div><div id="osecret"></div></div>' : "") +
			'<div class="scroll">' + (orgs.length ? userTable(orgs, true) : '<div class="empty">No organisations yet. Give an account the gold badge, or create one above.</div>') + "</div>";
		if ($("#oc")) $("#oc").onclick = () => act(async () => {
			const r = await api("createOrg", { screen_name: $("#oh").value, name: $("#on").value });
			$("#osecret").innerHTML = '<div class="secret">Created. Its password: <span class="code">' + esc(r.password) + '</span><br><span class="dim small">Shown once. Give it to whoever runs the organisation.</span></div>';
			const { orgs } = await api("orgs");
			main.querySelector(".scroll").innerHTML = userTable(orgs, true);
		});
	},

	async posts(main) {
		main.innerHTML = '<h1>Posts</h1><div class="bar"><input id="q" placeholder="Text contains" style="flex:1;min-width:160px"><input id="author" placeholder="@author"></div><div id="list" class="scroll"></div>';
		const load = async () => {
			const { posts } = await api("posts", { q: $("#q").value, author: $("#author").value });
			$("#list").innerHTML = posts.length
				? '<table class="table"><tr><th>Post</th><th>Author</th><th>When</th><th></th></tr>' +
					posts.map((p) => "<tr><td>" + (p.reply_to_id ? '<span class="dim small">reply · </span>' : "") + esc(p.text || "(no text)") + (p.media ? ' <span class="dim small">· ' + p.media + " media</span>" : "") +
						'<div class="dim small">' + p.likes + ' likes · <a href="/' + esc(p.screen_name) + "/status/" + esc(p.id) + '" target="_blank">open</a></div></td><td><a href="#user/' + "" + '" data-handle="' + esc(p.screen_name) + '">@' + esc(p.screen_name) + '</a></td><td class="small dim">' + esc(when(p.created_at)) + "</td><td>" +
						(can("moderator") ? '<button class="btn danger" data-del="' + esc(p.id) + '">Delete</button>' : "") + "</td></tr>").join("") + "</table>"
				: '<div class="empty">No posts match.</div>';
			$("#list").querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
				if (!confirm("Delete this post for everyone?")) return;
				act(() => api("deletePost", { id: b.dataset.del }), "Post deleted").then(load);
			});
			$("#list").querySelectorAll("[data-handle]").forEach((a) => a.onclick = async (e) => {
				e.preventDefault();
				const { users } = await api("users", { q: a.dataset.handle });
				const u = users.find((x) => x.screen_name.toLowerCase() === a.dataset.handle.toLowerCase());
				if (u) go("user/" + u.id);
			});
		};
		let t;
		$("#q").oninput = $("#author").oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
		await load();
	},

	async invites(main) {
		const [{ invites }, { orgs }] = await Promise.all([api("invites"), api("orgs")]);
		const state = (i) => i.revoked ? "revoked" : i.uses >= i.max_uses ? "used up" : i.expires_at && new Date(i.expires_at) < new Date() ? "expired" : "open";
		main.innerHTML = "<h1>Invites</h1>" +
			(can("admin") ? '<div class="box" style="margin-bottom:16px"><h2>Make invites</h2><div class="row">' +
				'<label class="small dim">How many <input id="n" type="number" min="1" max="50" value="1" style="width:70px"></label>' +
				'<label class="small dim">Uses each <input id="u" type="number" min="1" value="1" style="width:80px"></label>' +
				'<label class="small dim">Expires in days <input id="d" type="number" min="0" placeholder="never" style="width:90px"></label>' +
				'<label class="small dim">Joins organisation <select id="o"><option value="">none</option>' + orgs.map((o) => '<option value="' + esc(o.id) + '">@' + esc(o.screen_name) + "</option>").join("") + "</select></label>" +
				'<button class="btn primary" id="make">Make</button></div><div id="made"></div></div>' : "") +
			'<div class="scroll"><table class="table"><tr><th>Code</th><th>State</th><th>Used</th><th>By</th><th>Made</th><th></th></tr>' +
			invites.map((i) => '<tr><td class="code">' + esc(i.code) + (i.org ? ' <span class="dim small">→ @' + esc(i.org) + "</span>" : "") + "</td><td>" + esc(state(i)) + "</td><td>" + i.uses + "/" + i.max_uses +
				(i.used_by.length ? '<div class="dim small">' + i.used_by.map((n) => "@" + esc(n)).join(", ") + "</div>" : "") + '</td><td class="small">' + (i.created_by ? "@" + esc(i.created_by) : '<span class="dim">script</span>') +
				'</td><td class="small dim">' + esc(when(i.created_at)) + (i.expires_at ? "<br>until " + esc(when(i.expires_at)) : "") + "</td><td>" +
				(can("admin") && state(i) === "open" ? '<button class="btn" data-copy="' + esc(i.code) + '">Copy link</button> <button class="btn danger" data-revoke="' + esc(i.code) + '">Revoke</button>' : "") + "</td></tr>").join("") +
			"</table></div>";
		const link = (code) => location.origin + "/signup?code=" + code;
		main.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => navigator.clipboard.writeText(link(b.dataset.copy)).then(() => notice("Link copied")));
		main.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = () => act(() => api("revokeInvite", { code: b.dataset.revoke }), "Revoked").then(route));
		if ($("#make")) $("#make").onclick = () => act(async () => {
			const r = await api("createInvite", { count: $("#n").value, uses: $("#u").value, days: $("#d").value, orgId: $("#o").value || undefined });
			await route();
			$("#made").innerHTML = '<div class="secret">' + r.codes.map((c) => '<div><span class="code">' + esc(c) + '</span> <a href="' + esc(link(c)) + '" target="_blank" class="small">' + esc(link(c)) + "</a></div>").join("") + "</div>";
		});
	},

	async settings(main) {
		const { settings } = await api("settings");
		const modes = { invite: "Invite only: a code is needed", open: "Open: anyone can sign up, codes optional", closed: "Closed: no new accounts" };
		main.innerHTML = '<h1>Settings</h1><div class="box"><h2>Sign-up</h2>' +
			Object.entries(modes).map(([k, v]) => '<label class="row" style="margin:6px 0"><input type="radio" name="mode" value="' + k + '"' + (settings.signup_mode === k ? " checked" : "") + (can("admin") ? "" : " disabled") + "> " + esc(v) + "</label>").join("") +
			"</div>" + '<p class="dim small">More instance settings (name, logo, limits, feature switches, announcements) come in the next part of the panel.</p>';
		main.querySelectorAll("[name=mode]").forEach((r) => r.onchange = () => act(() => api("setSignupMode", { mode: r.value }), "Sign-up mode saved"));
	},

	async audit(main) {
		const { entries } = await api("audit");
		main.innerHTML = '<h1>Audit log</h1><div class="scroll">' + (entries.length
			? '<table class="table"><tr><th>When</th><th>Who</th><th>Did</th><th>To</th><th>Details</th></tr>' +
				entries.map((e) => '<tr><td class="small dim">' + esc(when(e.created_at)) + "</td><td>@" + esc(e.actor ?? "?") + "</td><td>" + esc(e.action.replace(/_/g, " ")) + "</td><td>" +
					(e.target_name ? '<a href="#user/' + esc(e.target) + '">@' + esc(e.target_name) + "</a>" : esc(e.target ?? "")) + '</td><td class="small dim code">' + esc(e.detail ? JSON.stringify(e.detail) : "") + "</td></tr>").join("") + "</table>"
			: '<div class="empty">Nothing yet.</div>') + "</div>";
	},
};

function userTable(users, orgs = false) {
	const html = '<table class="table"><tr><th>Account</th><th>' + (orgs ? "Affiliates" : "Posts") + "</th><th>Followers</th><th>Joined</th><th>Last sign-in</th></tr>" +
		users.map((u) => '<tr class="click" data-id="' + esc(u.id) + '"><td>' + person(u) + (u.org ? '<div class="dim small">affiliate of @' + esc(u.org) + "</div>" : "") + "</td><td>" + (orgs ? u.affiliates : u.posts) + "</td><td>" + u.followers +
			'</td><td class="small dim">' + esc(when(u.created_at)) + '</td><td class="small dim">' + esc(when(u.last_seen_at)) + "</td></tr>").join("") + "</table>";
	setTimeout(() => document.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => go("user/" + tr.dataset.id)));
	return html;
}

async function renderUser(main, id) {
	const { user: u, invited, log } = await api("user", { id });
	const isOrg = u.verified_type === "business";
	const affiliates = isOrg ? (await api("affiliates", { orgId: id })).affiliates : [];
	const self = me && me.id === u.id;
	main.innerHTML =
		'<p><a href="#users">← Users</a></p>' + person(u) +
		'<p class="dim small">Joined ' + esc(when(u.created_at)) + " · last sign-in " + esc(when(u.last_seen_at)) + " · " + u.posts + " posts · " + u.followers + " followers · " + u.sessions + " active sessions" +
		(u.invite_code ? " · invite " + '<span class="code">' + esc(u.invite_code) + "</span>" + (u.invited_by ? " from @" + esc(u.invited_by) : "") : "") +
		(u.org ? " · affiliate of @" + esc(u.org) : "") + ' · <a href="/' + esc(u.screen_name) + '" target="_blank">open profile</a></p>' +
		'<div class="grid2">' +
		// profile
		'<div class="box"><h2>Profile</h2>' +
		[["name", "Name", u.name], ["screen_name", "Handle", u.screen_name], ["location", "Location", u.location], ["website", "Website", u.website]]
			.map(([k, l, v]) => '<div class="field"><label>' + l + '</label><input data-f="' + k + '" value="' + esc(v) + '"' + (can("admin") ? "" : " disabled") + "></div>").join("") +
		'<div class="field"><label>Bio</label><textarea data-f="bio"' + (can("admin") ? "" : " disabled") + ">" + esc(u.bio) + "</textarea></div>" +
		(can("admin") ? '<button class="btn primary" id="save">Save profile</button>' : "") + "</div>" +
		// badges
		'<div class="box"><h2>Badge and flag</h2><div class="field"><label>Verification badge</label><select id="badge"' + (can("admin") ? "" : " disabled") + ">" +
		[["", "none"], ["blue", "blue"], ["business", "gold (organisation)"], ["government", "grey (government)"]].map(([v, l]) => '<option value="' + v + '"' + ((u.verified_type ?? "") === v ? " selected" : "") + ">" + l + "</option>").join("") +
		'</select></div><div class="field"><label>Pride flag' + (u.org ? " (hidden while they show their organisation's badge)" : "") + '</label><div class="flags" id="flags">' +
		[{ id: "", name: "none" }].concat(flags).map((f) => '<button type="button" title="' + esc(f.name) + '" data-flag="' + esc(f.id) + '" class="' + ((u.flag ?? "") === f.id ? "on" : "") + '"' + (can("admin") ? "" : " disabled") + ">" +
			(f.id ? '<img alt="" src="/public/flag-' + esc(f.id) + '.svg">' : "none") + "</button>").join("") + "</div></div></div>" +
		// standing
		'<div class="box"><h2>Standing</h2><p class="dim small">Now: <b>' + esc(u.status) + "</b></p>" +
		'<div class="field"><label>Reason (kept in the audit log)</label><input id="reason" placeholder="optional"></div><div class="row">' +
		[["active", "Reinstate", ""], ["restricted", "Restrict", "Can read, can't post"], ["limited", "Limit", "Only followers see their posts"], ["suspended", "Suspend", "Signed out, hidden everywhere"]]
			.map(([s, l, t]) => '<button class="btn' + (s === "suspended" ? " danger" : "") + '" data-status="' + s + '" title="' + esc(t) + '"' + (u.status === s || !can("moderator") || self ? " disabled" : "") + ">" + l + "</button>").join("") +
		'</div><p class="dim small">Restrict: can read, can\'t post. Limit: only followers see their posts. Suspend: signed out and hidden everywhere.</p></div>' +
		// access
		'<div class="box"><h2>Access</h2><div class="row"><button class="btn" id="reset">Reset password</button><button class="btn" id="signout">Sign out everywhere</button></div><div id="secret"></div>' +
		(can("admin") ? '<div class="field" style="margin-top:14px"><label>Staff role</label><select id="role"><option value="">none</option>' + ["support", "moderator", "admin"].map((r) => '<option' + (u.role === r ? " selected" : "") + ">" + r + "</option>").join("") + "</select></div>" : "") +
		(can("admin") && !self ? '<div class="field" style="margin-top:14px"><label>Delete account (type @' + esc(u.screen_name) + ' to confirm)</label><div class="row"><input id="confirm" placeholder="' + esc(u.screen_name) + '"><button class="btn danger" id="delete">Delete forever</button></div></div>' : "") +
		"</div>" +
		"</div>" +
		// organisation
		(isOrg ? '<h2>Affiliates</h2>' + (can("admin") ? '<div class="bar"><input id="aff" placeholder="@handle to add"><button class="btn primary" id="addaff">Add affiliate</button></div>' : "") +
			(affiliates.length ? '<div class="scroll"><table class="table">' + affiliates.map((a) => '<tr><td>' + person(a) + "</td><td>" + (can("admin") ? '<button class="btn danger" data-unaff="' + esc(a.id) + '">Remove</button>' : "") + "</td></tr>").join("") + "</table></div>" : '<div class="empty">No affiliates yet.</div>') : "") +
		(invited.length ? "<h2>Invited</h2><p>" + invited.map((i) => '<a href="#user/' + esc(i.id) + '">@' + esc(i.screen_name) + "</a>").join(", ") + "</p>" : "") +
		"<h2>History</h2>" + (log.length ? '<table class="table">' + log.map((e) => '<tr><td class="small dim">' + esc(when(e.created_at)) + "</td><td>@" + esc(e.actor ?? "?") + " " + esc(e.action.replace(/_/g, " ")) + '</td><td class="small dim code">' + esc(e.detail ? JSON.stringify(e.detail) : "") + "</td></tr>").join("") + "</table>" : '<div class="empty">No staff actions yet.</div>');

	const again = () => renderUser(main, id);
	if ($("#save")) $("#save").onclick = () => {
		const body = { id };
		main.querySelectorAll("[data-f]").forEach((el) => body[el.dataset.f] = el.value);
		act(() => api("updateUser", body), "Profile saved").then(again);
	};
	if ($("#badge")) $("#badge").onchange = () => act(() => api("setBadge", { id, badge: $("#badge").value }), "Badge set").then(again);
	main.querySelectorAll("[data-flag]").forEach((b) => b.onclick = () => act(() => api("setFlag", { id, flag: b.dataset.flag }), "Flag set").then(again));
	main.querySelectorAll("[data-status]").forEach((b) => b.onclick = () => {
		if (b.dataset.status === "suspended" && !confirm("Suspend @" + u.screen_name + "?")) return;
		act(() => api("setStatus", { id, status: b.dataset.status, reason: $("#reason").value }), "Standing changed").then(again);
	});
	$("#reset").onclick = () => {
		if (!confirm("Give @" + u.screen_name + " a new password and sign them out?")) return;
		act(async () => {
			const r = await api("resetPassword", { id });
			$("#secret").innerHTML = '<div class="secret">New password: <span class="code">' + esc(r.password) + '</span><br><span class="dim small">Shown once. They can sign in with it now.</span></div>';
		});
	};
	$("#signout").onclick = () => act(() => api("signOut", { id }), "Signed out").then(again);
	if ($("#role")) $("#role").onchange = () => act(() => api("setRole", { id, role: $("#role").value }), "Role set").then(again);
	if ($("#delete")) $("#delete").onclick = () => act(async () => { await api("deleteUser", { id, confirm: $("#confirm").value }); go("users"); }, "Account deleted");
	if ($("#addaff")) $("#addaff").onclick = () => act(() => api("addAffiliate", { orgId: id, screen_name: $("#aff").value }), "Affiliate added").then(again);
	main.querySelectorAll("[data-unaff]").forEach((b) => b.onclick = () => act(() => api("removeAffiliate", { orgId: id, userId: b.dataset.unaff }), "Removed").then(again));
}

(async function start() {
	try {
		me = await api("me");
		flags = await (await fetch("/admin/flags.json")).json();
	} catch (e) {
		$("#main").innerHTML = '<div class="empty">' + esc(e.message) + ' <a href="/home">Back to Xitter</a></div>';
		return;
	}
	$("#nav").insertAdjacentHTML("beforeend", Object.entries(PAGES).map(([k, p]) => '<button data-page="' + k + '"><span class="icon">' + p.icon + "</span>" + esc(p.title) + "</button>").join("") +
		'<button onclick="location.href=\'/home\'"><span class="icon">arrow_back</span>Back to Xitter</button>' +
		'<div class="who">@' + esc(me.screen_name) + " · " + esc(me.role) + "</div>");
	document.querySelectorAll("nav [data-page]").forEach((b) => b.onclick = () => go(b.dataset.page));
	route();
})();
</script>
</body>
</html>
